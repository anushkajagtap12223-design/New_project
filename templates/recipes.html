{% extends "base.html" %}
{% block title %} Recipes {% endblock %}
{% block content %}
<div class="container" mt-5>
    <h2 class="text-center" style="color: brown;" mb-4>All Recipes</h2>\
    <form method="GET" action="/recipes" class="mb-4">
        <div class="input-group">
            <input type="text" name="search" class="form-control" placeholder="search_recipe"
                value="{{request.args.get('search','')}}">
            <button class="btn btn-primary">Search</button>
        </div>
    </form>
    <div class="row">
        {% if recipes %}
        {% for recipe in recipes %}
        <div class="col-md-4">
            <div class="card shadow mb-4">
                <div class="card-body">
                    <h4>{{recipe[1]}}</h4>
                    <hr>
                    <h6>Ingredient</h6>
                    <p>{{recipe[2]}}</p>
                    <a href="/recipe_details/{{recipe[0]}}" class="btn btn-success">View_details</a>
                    <a href="/edit_recipe/{{recipe[0]}}" class="btn btn-warning">Edit</a>
                    <a href="/delete_recipe/{{recipe[0]}}" class="btn btn-danger mt-2"
                        onclick="return confirm('Are you sure ?')">Delete</a>

                </div>
            </div>
        </div>
        {% endfor %}
        {% else %}
        <div class="alert alert-warning text-center">
            NO REcipe Found
        </div>
        {% endif %}

    </div>
</div>
{% endblock %}
