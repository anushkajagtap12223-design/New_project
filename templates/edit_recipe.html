{% extends "base.html" %}
{% block title %} Edit Recipe {% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="shadow-lg border-0 rounded-4">
            <h2>Edit page</h2>
        <form method="POST">
            <label>Title</label>
            <input type="text" name="title" class="form-control" value="{{recipe[1]}}" required>

            <label class="form-label">Ingredients</label>
            <textarea name="Ingredient" class="form-control" rows="4" required>{{recipe[2]}}</textarea>

             <label class="form-label">Instruction</label>
            <textarea name="Instruction" class="form-control" rows="4" required>{{recipe[3]}}</textarea>

            <div class="mt-4">
                <button type="submit" class="btn btn-warning">Update</button>
                <a href="/recipes" class="btn btn-secondary">Cancel</a>
            </div>
        </form>

        </div>
    </div>
</div>
{% endblock %}
