<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Recipe hub{% endblock %}</title></title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.rtl.min.css" integrity="sha384-CfCrinSRH2IR6a4e6fy2q6ioOX7O6Mtm1L9vRvFZ1trBncWmMePhzvafv7oIcWiW" crossorigin="anonymous">

</head>
<body style="background-color:black;">
     <nav class="navbar navbar-expand-lg  navbar-dark " style="background-color: black;">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard" col>Recipe Hub</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="/index"></a>
          </li>
          <li class="nav-item">
            <a class="btn btn-success ms-2"  href="/add_recipe">Add Recipe</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-primary ms-2"  href="/recipes">Recipes</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-primary ms-2"  href="/logout">Logout</a>
          </li>
    
      </div>
    </div>
  </nav>
  <div class="container mt-4">
    {% block content %}
    {% endblock %}
  </div>

  <footer class="bg-dark text-white text-center p-3 mt-5">
    @2026 RecipeHub |Made with ❤️ using Flask
  </footer>

   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

    
</body>
</html>
