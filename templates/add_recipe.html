{% extends "base.html"%}
{% block title %} ADD Recipe {% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col md-8">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body">
                <h2>Add Recipes</h2>
                <form action="/add_recipe" method="POST">
                    <label class="form-label">Recipe title</label><br>
                    <input type="text" name="title"><br><br>

                    <label class="form-label">Ingredients</label><br>
                    <textarea name="ingredient" class="form-control" required></textarea><br><br>

                    <label class="form-label">Instructions</label><br>
                    <textarea name="instruction" class="form-control" required></textarea><br><br>

                    <button type="submit">Save Recipes</button>
                    <a href="/dashboard" class="btn btn-secondary">back</a>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
