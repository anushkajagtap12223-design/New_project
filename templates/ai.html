{%extends "base.html"%}
{% block title %}AI recipe{% endblock %}
{% block content %}
<style>
    body {
        background-color: #121212;
    }

    .container {
        background-color: #1e1e1e;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);

    }

    h2 {
        color: #00bfa6;
    }

    label {
        color: #f5f5f5;
        font-weight: 500;
    }

    textarea {
        background-color: #2b2b2b !important;
        color: #ffffff !important;
        border: 1px soild #555 !important;
    }

    textarea::placeholder {
        color: #aaaaaa;
    }

    .btn-primary {
        background-color: #009e89;
        border-color: #009e89;
    }

    .recipe-result {
        background-color: #181818;
        padding: 25px;
        border-radius: 12px;
        border: 1px solid #333;
        margin-top: 20px;
    }

    pre {
        color: #f5f5f5;
        white-space: pre-wrap;
        font-family: inherit;
        line-height: 1.6;
    }
</style>

<div class="container mt-5">
    <h2 class="text-center mb-4">AI Recipe Generater</h2>
    <form method="post">
        <div class="mb-3"><label>Enter Ingredients</label><textarea class="form-control" name="ingredeint"
                placeholder="Example:Tomato,Onion,Potato"></textarea></div><button class="btn btn-primary">Generate
            Recipe</button>
    </form> 
    {% if recipe %}

    <hr>
    <h3>Generated Recipe</h3>
    <pre> {{recipe}} </pre> 
    {% endif %}

</div>

{% endblock %}
